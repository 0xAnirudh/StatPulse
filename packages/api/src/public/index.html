<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Status</title>
    <style>
      /*
       * One file, no build step, no framework.
       *
       * This page has to load when everything else is on fire, so it
       * pulls in nothing: no CDN that might itself be down, no bundle to
       * rebuild, no font that blocks the first paint. The whole thing is
       * a few KB and it renders from one fetch.
       */
      :root {
        --bg: #fbfbfa;
        --panel: #fff;
        --border: #e4e4e1;
        --text: #1a1a18;
        --muted: #6b6b66;
        --ok: #18794e;
        --warn: #b7791f;
        --bad: #c23b34;
        --ok-bg: #e8f5ee;
        --warn-bg: #fdf5e6;
        --bad-bg: #fdeceb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --panel: #1e1e23;
          --border: #2e2e35;
          --text: #ececef;
          --muted: #9a9aa3;
          --ok: #4ade80;
          --warn: #fbbf24;
          --bad: #f87171;
          --ok-bg: #12241a;
          --warn-bg: #2a2113;
          --bad-bg: #2a1616;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .updated {
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .banner {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
        margin-bottom: 28px;
        font-size: 17px;
        font-weight: 550;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .banner.ok {
        background: var(--ok-bg);
        border-color: color-mix(in srgb, var(--ok) 28%, transparent);
        color: var(--ok);
      }
      .banner.warn {
        background: var(--warn-bg);
        border-color: color-mix(in srgb, var(--warn) 30%, transparent);
        color: var(--warn);
      }
      .banner.bad {
        background: var(--bad-bg);
        border-color: color-mix(in srgb, var(--bad) 30%, transparent);
        color: var(--bad);
      }
      .stale {
        display: inline-block;
        margin-left: auto;
        font-size: 12px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 5px;
        background: var(--warn-bg);
        color: var(--warn);
        border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent);
      }
      .group {
        margin-bottom: 26px;
      }
      .group h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 8px 2px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.bad {
        background: var(--bad);
      }
      .name {
        font-weight: 500;
      }
      .meta {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .state {
        font-size: 12.5px;
        font-weight: 550;
      }
      .state.ok {
        color: var(--ok);
      }
      .state.warn {
        color: var(--warn);
      }
      .state.bad {
        color: var(--bad);
      }
      .incident {
        border: 1px solid color-mix(in srgb, var(--bad) 25%, var(--border));
        background: var(--panel);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      .incident h3 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
      }
      .incident .tags {
        font-size: 11.5px;
        color: var(--muted);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .incident p {
        margin: 0;
        font-size: 14px;
        color: var(--text);
      }
      .incident time {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        font-weight: 600;
        margin: 0 0 10px 2px;
      }
      footer {
        margin-top: 36px;
        font-size: 12px;
        color: var(--muted);
      }
      .err {
        padding: 18px;
        border-radius: 10px;
        background: var(--bad-bg);
        color: var(--bad);
        border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent);
      }
      @media (max-width: 520px) {
        .meta {
          gap: 10px;
        }
        .uptime {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>System Status</h1>
        <span class="updated" id="updated"></span>
      </header>
      <div id="root">
        <div class="banner">Loading…</div>
      </div>
      <footer>Refreshes automatically every 30 seconds.</footer>
    </div>

    <script>
      const SEVERITY = {
        OPERATIONAL: 'ok',
        DEGRADED: 'warn',
        PARTIAL_OUTAGE: 'warn',
        MAJOR_OUTAGE: 'bad',
        MAINTENANCE: 'warn',
        DOWN: 'bad',
      };

      const HEADLINE = {
        OPERATIONAL: 'All systems operational',
        DEGRADED: 'Degraded performance',
        PARTIAL_OUTAGE: 'Partial outage',
        MAJOR_OUTAGE: 'Major outage',
        MAINTENANCE: 'Under maintenance',
      };

      const LABEL = {
        OPERATIONAL: 'Operational',
        DEGRADED: 'Degraded',
        DOWN: 'Down',
      };

      const esc = (s) =>
        String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      function ago(iso) {
        const secs = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
        if (secs < 60) return `${secs}s ago`;
        if (secs < 3600) return `${Math.round(secs / 60)}m ago`;
        if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
        return `${Math.round(secs / 86400)}d ago`;
      }

      function componentRow(c) {
        const sev = SEVERITY[c.status] ?? 'warn';
        const latency = c.responseTimeMs != null ? `${c.responseTimeMs} ms` : '';
        const uptime = c.uptime?.['90d'] != null ? `${c.uptime['90d']}%` : '';
        return `
          <div class="row">
            <span class="dot ${sev}"></span>
            <span class="name">${esc(c.name)}</span>
            <span class="meta">
              ${uptime ? `<span class="uptime" title="90-day uptime">${uptime}</span>` : ''}
              ${latency ? `<span>${latency}</span>` : ''}
              <span class="state ${sev}">${esc(LABEL[c.status] ?? c.status)}</span>
            </span>
          </div>`;
      }

      function incidentCard(i) {
        return `
          <div class="incident">
            <h3>${esc(i.title)}</h3>
            <div class="tags">${esc(i.impact)} · ${esc(i.status)}${
              i.affectedComponents?.length ? ` · ${esc(i.affectedComponents.join(', '))}` : ''
            }</div>
            ${i.latestUpdate ? `<p>${esc(i.latestUpdate.message)}</p>` : ''}
            ${i.latestUpdate ? `<time>${ago(i.latestUpdate.timestamp)}</time>` : ''}
          </div>`;
      }

      function render(p) {
        const sev = SEVERITY[p.status] ?? 'warn';
        const parts = [
          `<div class="banner ${sev}">
             ${esc(HEADLINE[p.status] ?? p.status)}
             ${p.stale ? '<span class="stale">showing cached data</span>' : ''}
           </div>`,
        ];

        if (p.activeIncidents?.length) {
          parts.push('<div class="section-title">Active incidents</div>');
          parts.push(p.activeIncidents.map(incidentCard).join(''));
          parts.push('<div style="height:24px"></div>');
        }

        for (const g of p.groups ?? []) {
          parts.push(`
            <div class="group">
              <h2>${esc(g.name)}</h2>
              <div class="panel">${g.components.map(componentRow).join('')}</div>
            </div>`);
        }

        if (!p.groups?.length) {
          parts.push(
            '<div class="panel"><div class="row"><span class="name">No components are being monitored yet.</span></div></div>',
          );
        }

        document.getElementById('root').innerHTML = parts.join('');
        document.getElementById('updated').textContent = `Updated ${ago(p.updatedAt)}`;
        document.title = `${HEADLINE[p.status] ?? p.status} · Status`;
      }

      async function poll() {
        try {
          /*
           * cache: 'no-cache' revalidates rather than skipping the cache:
           * the browser sends If-None-Match, and when nothing has changed
           * the server answers 304 with no body at all. That is the whole
           * point of the ETag - a page that is cheap to watch, at exactly
           * the moment everybody is watching it.
           */
          const res = await fetch('/api/v1/status', { cache: 'no-cache' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          render(await res.json());
        } catch (err) {
          document.getElementById('root').innerHTML =
            `<div class="err">Could not reach the status service. ${esc(err.message)}</div>`;
        }
      }

      poll();
      setInterval(poll, 30_000);
      // Catch up straight away when a tab is brought back to the front,
      // rather than showing whatever was true when it was hidden.
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) poll();
      });
    </script>
  </body>
</html>
